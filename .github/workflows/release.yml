# Builds the platform installers on a real runner per OS and attaches them to the
# GitHub release for the pushed tag. Local flow stays `npm run release` (bump +
# changelog + tag); pushing the tag (`git push --follow-tags`) triggers this.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7 # https://github.com/actions/checkout
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7 # https://github.com/actions/setup-node
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - uses: softprops/action-gh-release@v3 # https://github.com/softprops/action-gh-release
        with:
          generate_release_notes: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
