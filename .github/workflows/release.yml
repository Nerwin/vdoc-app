# Builds the platform installers on a real runner per OS and attaches them to the
# GitHub release for the pushed tag. Local flow stays `npm run release` (bump +
# changelog + tag); pushing the tag (`git push --follow-tags`) triggers this.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Require macOS signing credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
      - name: Build release artifacts
        run: npm run dist
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
      - run: npm run check:bundle
      - name: Verify macOS artifacts
        if: runner.os == 'macOS'
        run: |
          find release -maxdepth 1 -name '*-mac-arm64.dmg' -print -quit | grep -q .
          find release -maxdepth 1 -name '*-mac-arm64.zip' -print -quit | grep -q .
      - name: Smoke test packaged macOS app
        if: runner.os == 'macOS'
        timeout-minutes: 1
        run: 'release/mac-arm64/V-DOC.app/Contents/MacOS/V-DOC --smoke-test'
      - name: Smoke test packaged Windows app
        if: runner.os == 'Windows'
        timeout-minutes: 1
        run: '& "release/win-unpacked/V-DOC.exe" --smoke-test'
      - name: Smoke test packaged Linux app
        if: runner.os == 'Linux'
        timeout-minutes: 1
        run: xvfb-run --auto-servernum release/linux-unpacked/vdoc-app --smoke-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.exe
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/latest*.yml
            release-assets/*.blockmap
